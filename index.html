<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book Your Shipment — Jalal International Group</title>
<style>
  :root{
    --navy:#0f2a5c; --navy-dark:#0a1d42; --navy-soft:#eaf0fb;
    --gray:#5b6472; --gray-light:#8a93a3; --line:#e3e7ee;
    --bg:#f4f6fa; --card:#ffffff;
    --green:#1f9d5a; --green-soft:#e7f7ee;
    --red:#d64550;
    color-scheme: light;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(180deg,#eef2f9 0%, var(--bg) 100%);
    color:#1b2433; min-height:100%; font-size:15px; -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .wrap{max-width:720px;margin:0 auto;padding:28px 18px 60px;}

  .brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:22px;}
  .brand img{width:96px;height:96px;object-fit:contain;margin-bottom:10px;}
  .brand h1{font-size:19px;margin:0;color:var(--navy);letter-spacing:-.2px;}
  .brand .tagline{font-size:12.5px;color:var(--gray);margin-top:4px;}

  .steps{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:26px;}
  .step-dot{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;max-width:120px;}
  .step-dot .circle{width:28px;height:28px;border-radius:50%;background:#dde3ee;color:var(--gray);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;border:2px solid #dde3ee;transition:all .2s ease;}
  .step-dot.active .circle{background:var(--navy);color:#fff;border-color:var(--navy);}
  .step-dot.done .circle{background:var(--green);color:#fff;border-color:var(--green);}
  .step-dot .lbl{font-size:10.5px;color:var(--gray-light);text-align:center;}
  .step-dot.active .lbl{color:var(--navy);font-weight:600;}
  .step-line{height:2px;background:#dde3ee;flex:1;margin-bottom:22px;max-width:40px;}
  .step-line.done{background:var(--green);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 24px;box-shadow:0 6px 24px rgba(15,42,92,.06);}
  .card h2{font-size:16.5px;margin:0 0 4px;color:var(--navy);}
  .card .sub{font-size:12.5px;color:var(--gray);margin-bottom:20px;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:12.5px;color:#334155;font-weight:600;}
  .field .req{color:var(--red);}
  .field input,.field select,.field textarea{
    background:#fbfcfe;border:1px solid var(--line);color:#1b2433;
    padding:11px 13px;border-radius:9px;font-size:14px;font-family:inherit;outline:none;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy);background:#fff;}
  .field textarea{resize:vertical;min-height:80px;}
  .hint{font-size:11px;color:var(--gray-light);}

  .choice-group{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .choice{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:13.5px;font-weight:600;color:#334155;text-align:center;transition:all .12s ease;user-select:none;}
  .choice:hover{border-color:#aebbd1;}
  .choice.selected{border-color:var(--navy);background:var(--navy-soft);color:var(--navy);}

  .btn-row{display:flex;justify-content:space-between;gap:12px;margin-top:24px;}
  .btn{border:none;padding:13px 22px;border-radius:10px;font-size:14.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-dark);}
  .btn-ghost{background:#eef1f6;color:#475267;}
  .btn-ghost:hover{background:#e3e8ef;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-block{width:100%;justify-content:center;}

  .review-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .review-row:last-child{border-bottom:none;}
  .review-row .k{color:var(--gray);}
  .review-row .v{color:#1b2433;font-weight:600;text-align:right;max-width:60%;}
  .review-section-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--navy);font-weight:700;margin:18px 0 6px;}
  .review-section-title:first-child{margin-top:0;}

  .thankyou{text-align:center;padding:10px 0 4px;}
  .thankyou .tick{width:68px;height:68px;border-radius:50%;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:34px;}
  .thankyou h2{color:var(--navy);font-size:20px;margin:0 0 8px;}
  .thankyou p{color:var(--gray);font-size:13.5px;line-height:1.6;max-width:440px;margin:0 auto 22px;}
  .thankyou .ref{background:var(--navy-soft);color:var(--navy);display:inline-block;padding:8px 16px;border-radius:8px;font-size:12.5px;font-weight:700;margin-bottom:22px;}
  .cta-row{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto;}
  .cta-whatsapp{background:#1fae59;color:#fff;}
  .cta-whatsapp:hover{background:#188f49;}

  .error-text{color:var(--red);font-size:11.5px;margin-top:-10px;margin-bottom:10px;display:none;}
  .field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--red);}
  .field.invalid .error-text{display:block;}

  .footer-note{text-align:center;font-size:11px;color:var(--gray-light);margin-top:22px;}

  @media (max-width:560px){
    .form-grid{grid-template-columns:1fr;}
    .choice-group{grid-template-columns:1fr 1fr;}
    .card{padding:20px 18px;}
    .step-dot .lbl{display:none;}
  }
</style>
</head>

    <h1>Jalal International Group</h1>
    <div class="tagline">Your Global Logistics Partner — Request a Shipment Booking</div>
  </div>

  <div class="steps" id="stepsBar"></div>

  <div class="card" id="cardWrap"></div>

  <div class="footer-note">Your information is sent directly to our team and is not shared with any third party.</div>

<script>
const STEP_LABELS = ['Your Info','Shipment','Notes','Review'];
let currentStep = 0; // 0..3, then 4 = thank you
const DATA = {
  name:'', company:'', email:'', phone:'',
  shipmentType:'Export', mode:'Sea FCL', origin:'', destination:'',
  cargoDesc:'', quantity:'', pickupNeeded:'No', pickupAddress:'', preferredDate:'',
  notes:'', fragile:false, hazardous:false, tempControlled:false
};

const COMPANY_EMAIL = 'Pt.jalal.international.group@gmail.com';
const COMPANY_WHATSAPP = '628119479000';
const WEB3FORMS_KEY = 'ebed7b8b-a53f-474c-bb8e-33fba2f6ddff';
let SEND_STATUS = 'sent'; // 'sent' or 'failed'

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderSteps(){
  const bar = document.getElementById('stepsBar');
  if(currentStep>3){ bar.innerHTML=''; return; }
  let html = '';
  STEP_LABELS.forEach((lbl,i)=>{
    const state = i<currentStep ? 'done' : (i===currentStep ? 'active' : '');
    html += `<div class="step-dot ${state}"><div class="circle">${i<currentStep?'✓':i+1}</div><div class="lbl">${lbl}</div></div>`;
    if(i<STEP_LABELS.length-1) html += `<div class="step-line ${i<currentStep?'done':''}"></div>`;
  });
  bar.innerHTML = html;
}

function setChoice(field, value, el){
  if(field==='pickupNeeded'){ collectStepFields(); } // save any typed text before re-rendering
  DATA[field] = value;
  if(field==='pickupNeeded'){
    renderStep(); // toggle pickup address field visibility
    return;
  }
  const group = el.parentElement;
  group.querySelectorAll('.choice').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
}

function showError(fieldId, show){
  const el = document.getElementById(fieldId).closest('.field');
  if(el) el.classList.toggle('invalid', show);
}

function renderStep(){
  renderSteps();
  const wrap = document.getElementById('cardWrap');
  if(currentStep===0){
    wrap.innerHTML = `
      <h2>Your Information</h2>
      <div class="sub">Tell us who you are so we can get back to you</div>
      <div class="form-grid">
        <div class="field full"><label>Full Name <span class="req">*</span></label><input id="f_name" value="${esc(DATA.name)}" placeholder="e.g. Ahmed Rashid"><div class="error-text">Please enter your name</div></div>
        <div class="field full"><label>Company Name</label><input id="f_company" value="${esc(DATA.company)}" placeholder="e.g. Al Noor Trading LLC"></div>
        <div class="field"><label>Email <span class="req">*</span></label><input id="f_email" type="email" value="${esc(DATA.email)}" placeholder="you@company.com"><div class="error-text">Please enter a valid email</div></div>
        <div class="field"><label>Phone / WhatsApp <span class="req">*</span></label><input id="f_phone" value="${esc(DATA.phone)}" placeholder="+971 50 123 4567"><div class="error-text">Please enter your phone number</div></div>
      </div>
      <div class="btn-row"><span></span><button class="btn btn-primary" onclick="goNext()">Next →</button></div>
    `;
  } else if(currentStep===1){
    wrap.innerHTML = `
      <h2>Shipment Details</h2>
      <div class="sub">Tell us what you need shipped</div>
      <div class="field full"><label>Shipment Type</label>
        <div class="choice-group">
          <div class="choice ${DATA.shipmentType==='Export'?'selected':''}" onclick="setChoice('shipmentType','Export',this)">Export</div>
          <div class="choice ${DATA.shipmentType==='Import'?'selected':''}" onclick="setChoice('shipmentType','Import',this)">Import</div>
        </div>
      </div>
      <div class="field full"><label>Shipping Mode</label>
        <div class="choice-group">
          <div class="choice ${DATA.mode==='Sea FCL'?'selected':''}" onclick="setChoice('mode','Sea FCL',this)">Sea — FCL</div>
          <div class="choice ${DATA.mode==='Sea LCL'?'selected':''}" onclick="setChoice('mode','Sea LCL',this)">Sea — LCL</div>
          <div class="choice ${DATA.mode==='Air Freight'?'selected':''}" onclick="setChoice('mode','Air Freight',this)">Air Freight</div>
          <div class="choice ${DATA.mode==='Land Freight'?'selected':''}" onclick="setChoice('mode','Land Freight',this)">Land Freight</div>
        </div>
      </div>
      <div class="form-grid">
        <div class="field"><label>Origin <span class="req">*</span></label><input id="f_origin" value="${esc(DATA.origin)}" placeholder="e.g. Jakarta, Indonesia"><div class="error-text">Please enter the origin</div></div>
        <div class="field"><label>Destination <span class="req">*</span></label><input id="f_destination" value="${esc(DATA.destination)}" placeholder="e.g. Dubai, UAE"><div class="error-text">Please enter the destination</div></div>
        <div class="field full"><label>Cargo Description <span class="req">*</span></label><input id="f_cargoDesc" value="${esc(DATA.cargoDesc)}" placeholder="e.g. Electronics, 150 cartons"><div class="error-text">Please describe your cargo</div></div>
        <div class="field"><label>Estimated Volume / Weight</label><input id="f_quantity" value="${esc(DATA.quantity)}" placeholder="e.g. 12 CBM / 2,400 kg"></div>
        <div class="field"><label>Preferred Pickup / Ship Date</label><input id="f_preferredDate" type="date" value="${esc(DATA.preferredDate)}"></div>
      </div>
      <div class="field full"><label>Do you need cargo pickup?</label>
        <div class="choice-group">
          <div class="choice ${DATA.pickupNeeded==='Yes'?'selected':''}" onclick="setChoice('pickupNeeded','Yes',this)">Yes, pick up my cargo</div>
          <div class="choice ${DATA.pickupNeeded==='No'?'selected':''}" onclick="setChoice('pickupNeeded','No',this)">No, I'll deliver it</div>
        </div>
      </div>
      ${DATA.pickupNeeded==='Yes' ? `<div class="field full"><label>Pickup Address</label><input id="f_pickupAddress" value="${esc(DATA.pickupAddress)}" placeholder="Full pickup address"></div>` : ''}
      <div class="btn-row"><button class="btn btn-ghost" onclick="goBack()">← Back</button><button class="btn btn-primary" onclick="goNext()">Next →</button></div>
    `;
  } else if(currentStep===2){
    wrap.innerHTML = `
      <h2>Additional Notes</h2>
      <div class="sub">Anything else we should know?</div>
      <div class="field full"><label>Special Handling</label>
        <div class="choice-group">
          <div class="choice ${DATA.fragile?'selected':''}" onclick="toggleFlag('fragile',this)">Fragile</div>
          <div class="choice ${DATA.hazardous?'selected':''}" onclick="toggleFlag('hazardous',this)">Hazardous / DG</div>
          <div class="choice ${DATA.tempControlled?'selected':''}" onclick="toggleFlag('tempControlled',this)">Temperature Controlled</div>
        </div>
      </div>
      <div class="field full"><label>Notes / Special Requirements</label><textarea id="f_notes" placeholder="Anything else our team should know about this shipment...">${esc(DATA.notes)}</textarea></div>
      <div class="btn-row"><button class="btn btn-ghost" onclick="goBack()">← Back</button><button class="btn btn-primary" onclick="goNext()">Next →</button></div>
    `;
  } else if(currentStep===3){
    wrap.innerHTML = `
      <h2>Review Your Request</h2>
      <div class="sub">Please check your details before submitting</div>
      <div class="review-section-title">Your Information</div>
      <div class="review-row"><span class="k">Name</span><span class="v">${esc(DATA.name)}</span></div>
      <div class="review-row"><span class="k">Company</span><span class="v">${esc(DATA.company)||'—'}</span></div>
      <div class="review-row"><span class="k">Email</span><span class="v">${esc(DATA.email)}</span></div>
      <div class="review-row"><span class="k">Phone</span><span class="v">${esc(DATA.phone)}</span></div>
      <div class="review-section-title">Shipment</div>
      <div class="review-row"><span class="k">Type</span><span class="v">${esc(DATA.shipmentType)}</span></div>
      <div class="review-row"><span class="k">Mode</span><span class="v">${esc(DATA.mode)}</span></div>
      <div class="review-row"><span class="k">Origin → Destination</span><span class="v">${esc(DATA.origin)} → ${esc(DATA.destination)}</span></div>
      <div class="review-row"><span class="k">Cargo</span><span class="v">${esc(DATA.cargoDesc)}</span></div>
      <div class="review-row"><span class="k">Volume / Weight</span><span class="v">${esc(DATA.quantity)||'—'}</span></div>
      <div class="review-row"><span class="k">Preferred Date</span><span class="v">${esc(DATA.preferredDate)||'—'}</span></div>
      <div class="review-row"><span class="k">Pickup Needed</span><span class="v">${esc(DATA.pickupNeeded)}${DATA.pickupNeeded==='Yes' && DATA.pickupAddress ? ' — '+esc(DATA.pickupAddress) : ''}</span></div>
      ${(DATA.fragile||DATA.hazardous||DATA.tempControlled) ? `<div class="review-row"><span class="k">Special Handling</span><span class="v">${[DATA.fragile&&'Fragile',DATA.hazardous&&'Hazardous',DATA.tempControlled&&'Temp. Controlled'].filter(Boolean).join(', ')}</span></div>` : ''}
      ${DATA.notes ? `<div class="review-row"><span class="k">Notes</span><span class="v">${esc(DATA.notes)}</span></div>` : ''}
      <div class="btn-row"><button class="btn btn-ghost" onclick="goBack()">← Back</button><button class="btn btn-primary" id="submitBtn" onclick="submitRequest()">✓ Submit Shipment Request</button></div>
    `;
  } else {
    const ref = window.__lastRef || ('JIG-' + Date.now().toString().slice(-8));
    const ok = SEND_STATUS === 'sent';
    wrap.innerHTML = `
      <div class="thankyou">
        <div class="tick">${ok ? '✓' : '!'}</div>
        <h2>${ok ? 'Thank You, ' + esc(DATA.name.split(' ')[0]||'') + '!' : 'Sorry, we could not send it'}</h2>
        <p>${ok
          ? 'Your shipment request has been sent to our team. We will contact you shortly.'
          : 'Something went wrong while sending your request. Please check your internet and try again, or send it to us by email or WhatsApp below.'}</p>
        <div class="ref">Reference: ${ref}</div>
        <div class="cta-row">
          ${ok ? '' : `<button class="btn btn-primary btn-block" onclick="retrySend()">🔄 Try Again</button>
          <button class="btn btn-ghost btn-block" onclick="openEmail('${ref}')">📧 Send by Email Instead</button>
          <button class="btn btn-ghost btn-block" onclick="openWhatsApp('${ref}')">💬 Send by WhatsApp Instead</button>`}
          <button class="btn ${ok ? 'btn-primary' : 'btn-ghost'} btn-block" onclick="startOver()">Submit Another Request</button>
        </div>
      </div>
    `;
  }
}

function toggleFlag(field, el){
  DATA[field] = !DATA[field];
  el.classList.toggle('selected');
}

function collectStepFields(){
  if(currentStep===0){
    DATA.name = document.getElementById('f_name').value.trim();
    DATA.company = document.getElementById('f_company').value.trim();
    DATA.email = document.getElementById('f_email').value.trim();
    DATA.phone = document.getElementById('f_phone').value.trim();
  } else if(currentStep===1){
    DATA.origin = document.getElementById('f_origin').value.trim();
    DATA.destination = document.getElementById('f_destination').value.trim();
    DATA.cargoDesc = document.getElementById('f_cargoDesc').value.trim();
    DATA.quantity = document.getElementById('f_quantity').value.trim();
    DATA.preferredDate = document.getElementById('f_preferredDate').value;
    if(DATA.pickupNeeded==='Yes'){
      const pa = document.getElementById('f_pickupAddress');
      if(pa) DATA.pickupAddress = pa.value.trim();
    }
  } else if(currentStep===2){
    DATA.notes = document.getElementById('f_notes').value.trim();
  }
}

function validateStep(){
  collectStepFields();
  let ok = true;
  if(currentStep===0){
    showError('f_name', !DATA.name); if(!DATA.name) ok=false;
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(DATA.email);
    showError('f_email', !emailOk); if(!emailOk) ok=false;
    showError('f_phone', !DATA.phone); if(!DATA.phone) ok=false;
  } else if(currentStep===1){
    showError('f_origin', !DATA.origin); if(!DATA.origin) ok=false;
    showError('f_destination', !DATA.destination); if(!DATA.destination) ok=false;
    showError('f_cargoDesc', !DATA.cargoDesc); if(!DATA.cargoDesc) ok=false;
  }
  return ok;
}

function goNext(){
  if(!validateStep()) return;
  currentStep++;
  renderStep();
  window.scrollTo({top:0, behavior:'smooth'});
}
function goBack(){
  currentStep--;
  renderStep();
  window.scrollTo({top:0, behavior:'smooth'});
}
function startOver(){
  Object.assign(DATA, {
    name:'', company:'', email:'', phone:'',
    shipmentType:'Export', mode:'Sea FCL', origin:'', destination:'',
    cargoDesc:'', quantity:'', pickupNeeded:'No', pickupAddress:'', preferredDate:'',
    notes:'', fragile:false, hazardous:false, tempControlled:false
  });
  currentStep = 0;
  renderStep();
  window.scrollTo({top:0, behavior:'smooth'});
}

function buildMessageBody(ref){
  const lines = [
    `New Shipment Booking Request — Reference ${ref}`,
    ``,
    `CLIENT INFORMATION`,
    `Name: ${DATA.name}`,
    `Company: ${DATA.company||'-'}`,
    `Email: ${DATA.email}`,
    `Phone/WhatsApp: ${DATA.phone}`,
    ``,
    `SHIPMENT DETAILS`,
    `Type: ${DATA.shipmentType}`,
    `Mode: ${DATA.mode}`,
    `Origin: ${DATA.origin}`,
    `Destination: ${DATA.destination}`,
    `Cargo: ${DATA.cargoDesc}`,
    `Est. Volume/Weight: ${DATA.quantity||'-'}`,
    `Preferred Date: ${DATA.preferredDate||'-'}`,
    `Pickup Needed: ${DATA.pickupNeeded}${DATA.pickupNeeded==='Yes' && DATA.pickupAddress ? ' ('+DATA.pickupAddress+')' : ''}`,
  ];
  const flags = [DATA.fragile&&'Fragile', DATA.hazardous&&'Hazardous/DG', DATA.tempControlled&&'Temperature Controlled'].filter(Boolean);
  if(flags.length) lines.push(`Special Handling: ${flags.join(', ')}`);
  if(DATA.notes) lines.push(``, `NOTES`, DATA.notes);
  return lines.join('\n');
}

async function sendToWeb3Forms(ref){
  const payload = {
    access_key: WEB3FORMS_KEY,
    subject: `Shipment Booking Request — ${DATA.name||'New Client'} (${ref})`,
    from_name: 'Jalal International Booking Form',
    name: DATA.name,
    email: DATA.email,
    phone: DATA.phone,
    message: buildMessageBody(ref)
  };
  const res = await fetch('https://api.web3forms.com/submit', {
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body: JSON.stringify(payload)
  });
  const json = await res.json();
  if(!res.ok || !json.success) throw new Error(json.message || 'Send failed');
}

async function submitRequest(){
  const btn = document.getElementById('submitBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Sending…'; }
  const ref = 'JIG-' + Date.now().toString().slice(-8);
  window.__lastRef = ref;
  try{
    await sendToWeb3Forms(ref);
    SEND_STATUS = 'sent';
  }catch(e){
    console.error(e);
    SEND_STATUS = 'failed';
  }
  currentStep = 4;
  renderStep();
  window.scrollTo({top:0, behavior:'smooth'});
}

async function retrySend(){
  const ref = window.__lastRef || ('JIG-' + Date.now().toString().slice(-8));
  try{
    await sendToWeb3Forms(ref);
    SEND_STATUS = 'sent';
  }catch(e){
    SEND_STATUS = 'failed';
  }
  renderStep();
}

function openEmail(ref){
  const r = ref || window.__lastRef || ('JIG-'+Date.now().toString().slice(-8));
  const subject = encodeURIComponent(`Shipment Booking Request — ${DATA.name||'New Client'} (${r})`);
  const body = encodeURIComponent(buildMessageBody(r));
  window.location.href = `mailto:${COMPANY_EMAIL}?subject=${subject}&body=${body}`;
}
function openWhatsApp(ref){
  const r = ref || window.__lastRef || ('JIG-'+Date.now().toString().slice(-8));
  const text = encodeURIComponent(`Hello Jalal International Group, I just submitted a shipment request (Ref ${r}).\n\n` + buildMessageBody(r));
  window.open(`https://wa.me/${COMPANY_WHATSAPP}?text=${text}`, '_blank');
}

renderStep();
</script>
</body>
</html>
